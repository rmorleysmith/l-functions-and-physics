name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerics:
    name: scripts (every number asserted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make check PY=python
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/

  notes:
    name: notes (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            notes/01-twelve-tones/twelve-tones.tex
            notes/02-characters-and-waves/characters-and-waves.tex
            notes/03-light/light.tex
            notes/04-what-an-l-function-is/what-an-l-function-is.tex
            notes/05-golden-ratio/golden-ratio.tex
            notes/06-number-theoretic-standard-model/number-theoretic-standard-model.tex
            notes/07-impulses-packets-spectra/impulses-packets-spectra.tex
            notes/08-light-cone-and-spheres/light-cone-and-spheres.tex
            notes/09-zeros-as-energy-levels/zeros-as-energy-levels.tex
          work_in_root_file_dir: true
      - name: Collect the PDFs
        run: |
          mkdir -p out
          cp notes/*/*.pdf out/
      - uses: actions/upload-artifact@v4
        with:
          name: notes-pdf
          path: out/

  release:
    name: attach the PDFs to a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [numerics, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes-pdf
          path: out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.pdf
